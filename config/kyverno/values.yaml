# Werte fuer das Kyverno-Helm-Chart.
admissionController:
  # Die CA von zot (ConfigMap testbed-ca, angelegt von scripts/cluster-up.sh)
  # kommt zusaetzlich zu den oeffentlichen CAs des Images hinzu. Die oeffentlichen
  # CAs werden weiter gebraucht, weil Kyverno Rekor und TUF von Sigstore erreicht.
  extraVolumes:
    - name: testbed-ca
      configMap:
        name: testbed-ca
  extraVolumeMounts:
    - name: testbed-ca
      mountPath: /etc/testbed-ca
      readOnly: true
  container:
    extraEnvVars:
      - name: SSL_CERT_DIR
        value: /etc/testbed-ca
