# kind-Cluster des Testbeds: ein einzelner Node.
# Das Node-Image wird ueber versions.env gepinnt (kind create cluster --image).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Service der Beispielanwendung (NodePort 30080) unter http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
