# kind cluster of the testbed: a single node.
# The node image is pinned via versions.env (kind create cluster --image).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Service of the example application (NodePort 30080) at http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
